# ============================================
# Configuration de la Base de Données (MariaDB)
# ============================================
spring.datasource.url=jdbc:mariadb://localhost:3306/sentinelle_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=sentinelle
spring.datasource.password=sentinelle_password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ============================================
# Configuration Hibernate / JPA
# ============================================
# Permet la mise à jour automatique des colonnes sans crash
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ============================================
# Configuration du Serveur Backend (Port 8080)
# ============================================
server.port=8080
server.address=0.0.0.0
