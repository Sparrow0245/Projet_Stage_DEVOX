# ===============================================================
# Configuration Apache2 - Sentinelle V4
# Emplacement GitHub : monitoring/04_sentinelle_supervision_securisee/config/sentinelle.conf
# Destination VM    : /etc/apache2/conf-available/sentinelle.conf
# ===============================================================

Alias /sentinelle /var/www/html/sentinelle

<Directory /var/www/html/sentinelle>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    # En-têtes de sécurité HTTP
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "no-referrer-when-downgrade"

    # Restriction d'accès aux fichiers sensibles (scripts, configs, logs)
    <FilesMatch "\.(sql|cnf|ini|log|sh|example|env)$">
        Require all denied
    </FilesMatch>
</Directory>
