# Configuration globale de Sentinelle V4

INSTALL_PATH=/opt/sentinelle
LOG_PATH=/var/log/sentinelle
TMP_PATH=/tmp/sentinelle
BACKUP_PATH=/opt/sentinelle/backups

# Fréquences de collecte (en secondes)
REFRESH_INTERVAL=5
CPU_INTERVAL=5
RAM_INTERVAL=5
NETWORK_INTERVAL=5
SERVICES_INTERVAL=10
SSH_INTERVAL=30
BACKUP_INTERVAL=86400

# Rétention des données (en jours)
DATA_RETENTION=30
LOG_RETENTION=90
BACKUP_RETENTION=30

# Options de sécurité et modules
ENABLE_APPARMOR=true
ENABLE_UFW=true
ENABLE_SMART=true
ENABLE_HISTORY=true
