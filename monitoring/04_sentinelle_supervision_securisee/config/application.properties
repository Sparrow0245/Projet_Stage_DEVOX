# Configuration de la base de données MariaDB / MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sentinelle?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=sentinelle
spring.datasource.password=SentinelleSecurePass2026!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Serveur Spring Boot (Écoute en local derrière le Reverse Proxy Apache)
server.port=8080
server.address=127.0.0.1

# Sécurité & JWT
jwt.secret=9a2f8c3e1b7d4f5a6c8e0b2d4f6a8c1e3b5d7f9a2b4c6d8e0f1a3c5b7d9e2f4a
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.sentinelle.monitoring=DEBUG
logging.file.name=/var/log/sentinelle/backend.log
