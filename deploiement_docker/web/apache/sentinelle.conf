<VirtualHost *:80>

    ServerName localhost

    DocumentRoot /var/www/html/sentinelle

    <Directory /var/www/html/sentinelle>

        Options -Indexes +FollowSymLinks

        AllowOverride All

        Require all granted

    </Directory>

    ProxyRequests Off

    ProxyPreserveHost On

    ProxyPass /api http://sentinelle-backend:8080/api
    ProxyPassReverse /api http://sentinelle-backend:8080/api

    ErrorLog ${APACHE_LOG_DIR}/sentinelle_error.log

    CustomLog ${APACHE_LOG_DIR}/sentinelle_access.log combined

</VirtualHost>
