services:
  db:
    image: mariadb:11.4
    profiles: ["local-db"]
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}

    volumes:
      - sentinelle_db:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

    networks:
      - sentinelle

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  collector:
    build:
      context: ..
      dockerfile: deploiement_docker/collector/Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    pid: host
    privileged: true

    volumes:
      - /:/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /run:/host/run:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/log:/host/var/log:ro
      - /run/dbus:/run/dbus:ro
      - /run/systemd:/run/systemd:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro

    networks:
      - sentinelle


  backend:
    build:
      context: ..
      dockerfile: deploiement_docker/backend/Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      SERVER_SERVLET_CONTEXT_PATH: /

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-28800}

    expose:
      - "8080"

    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"

    networks:
      - sentinelle


  web:
    build:
      context: ..
      dockerfile: deploiement_docker/web/Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - backend

    ports:
      - "${HTTP_PORT:-8080}:80"

    networks:
      - sentinelle


volumes:
  sentinelle_db:


networks:
  sentinelle:
    driver: bridge
